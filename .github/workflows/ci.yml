name: CI

# Kontrola při každém pushi a pull requestu:
# - frontend: typecheck a build
# - backend: syntaxe všech .js souborů
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-modely

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-modely/package-lock.json

      - name: Instalace závislostí
        run: npm ci

      - name: Kontrola typů
        run: npm run typecheck

      - name: Produkční build
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-modely-node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-modely-node/package-lock.json

      - name: Instalace závislostí
        run: npm ci

      - name: Syntaktická kontrola
        run: find . -name '*.js' -not -path './node_modules/*' -exec node --check {} \;
