            <text x="195" y="121" fill="#fff" fill-opacity="0.82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400">Prohlížení AI modelů z</text>

            <use href="#banner-hf" />

            <text x="477" y="121" fill="#fff" fill-opacity="0.82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400">Hugging Face</text>
        </g>

