        <text x="232" y="176" fill="#fff" fill-opacity="0.82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="400">Prohlížení AI modelů</text>

        <text x="232" y="243" fill="#fff" fill-opacity="0.82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="400">z</text>

