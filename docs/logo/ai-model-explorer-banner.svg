    <style>
        .layout-narrow {
            display: none;
        }

        @media (max-width: 700px) {
            .layout-wide {
                display: none;
            }

            .layout-narrow {
                display: block;
            }
        }

        .logo-breathe {
            transform-box: fill-box;
            transform-origin: center;
            animation: logo-breathe 2.2s ease-in-out infinite;
        }

        .logo-spark {
            transform-box: view-box;
            transform-origin: 140.4px 145px;
            animation: logo-spin 1.9s linear infinite;
        }

        .logo-spark--slow {
            animation-name: logo-spin-slow;
            animation-duration: 3.4s;
        }

        .logo-spark--narrow {
            transform-origin: 125px 145px;
        }

        @keyframes logo-breathe {
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes logo-spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes logo-spin-slow {
            from {
                transform: rotate(180deg);
            }
            to {
                transform: rotate(540deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-breathe,
            .logo-spark {
                animation: none;
            }
        }
    </style>

    <g class="layout-wide">
        <rect width="1200" height="290" rx="14" fill="#3a3a87" />

